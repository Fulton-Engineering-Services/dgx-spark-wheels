name: Build lmcache CPU wheel (x86_64)
#
# Builds the CPU-only lmcache wheel for x86_64 (Dell host coordinator).
# Same fork commit (ca2f474) as the GB10 GPU wheel, built with NO_GPU_EXT=1.
# Runs on a free GitHub ubuntu-24.04 x86_64 runner — no GPU, no container needed.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "lmcache fork ref to build"
        required: false
        type: string
        default: "ca2f474412e3b881c2f39e62561414c9676653dc"
  workflow_call:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PKG_NAME: lmcache-cpu
  FORK_URL: https://github.com/Fulton-Engineering-Services/lmcache
  FORK_BRANCH: cuda13.3-aarch64-gb10
  PUBLIC_VERSION: "0.5.5rc1"
  LOCAL_SEG: cpu.torch2.13.glibc239

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@b003c1c7e5c9109e083a6be77c91c0e318bac17b # v5.2.3
        with:
          python-version: "3.12"

      - name: Build CPU-only wheel
        run: |
          set -euo pipefail

          git clone --depth 1 --branch "$FORK_BRANCH" "$FORK_URL" src
          cd src
          head="$(git rev-parse HEAD)"
          if [ "$head" != "${{ inputs.ref }}" ]; then
            git fetch --unshallow
            git checkout "${{ inputs.ref }}"
          fi

          pip install --upgrade pip setuptools wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ninja packaging setuptools-scm build psutil numpy

          NO_GPU_EXT=1 ENABLE_CXX11_ABI=1 \
            SETUPTOOLS_SCM_PRETEND_VERSION="$PUBLIC_VERSION" \
            python -m build --wheel --no-isolation --skip-dependency-check

          cd ..
          built="$(ls -t src/dist/*.whl | head -1)"
          echo "Built: $built"
          scripts/build/inject-local-version.sh "$built" "$LOCAL_SEG"
          mkdir -p dist
          cp dist/*.whl dist/

      - name: Verify CPU wheel
        shell: bash
        run: |
          set -euo pipefail
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "$(ls dist/*.whl)" --no-deps
          python3 -c "import lmcache; assert lmcache.torch_device_type == 'cpu'; print(f'lmcache {lmcache.__version__} CPU OK')"

      - name: Verify common C++ extensions
        shell: python3
        run: |
          import lmcache.lmcache_native
          import lmcache.lmcache_redis
          import lmcache.lmcache_fs
          print('common C++ extensions OK')

      - name: Verify no CUDA ops
        shell: python3
        run: |
          try:
            import lmcache.cuda_ops
            exit(1)
          except (ModuleNotFoundError, ImportError):
            print('cuda_ops absent (correct)')

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-lmcache-cpu
          path: dist/*.whl
          retention-days: 1

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="lmcache-cpu-v${PUBLIC_VERSION}"
          sha="${{ github.sha }}"
          gh release create "$tag" dist/*.whl --title "$tag" --notes "Built from packages.json at ${sha:0:7}" || \
          gh release upload "$tag" dist/*.whl --clobber