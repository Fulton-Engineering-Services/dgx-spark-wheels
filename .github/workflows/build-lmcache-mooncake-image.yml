name: Build lmcache-mooncake image
#
# Builds and publishes the GB10 wheel-builder image that compiles the optional
# native lmcache.lmcache_mooncake extension (Mooncake Store L2 adapter) and
# leaves the resulting lmcache wheel at /dist. scripts/build/lmcache-mooncake.sh
# extracts that wheel and stamps it into the dgx-spark-wheels release.
#
# The Dockerfile layers on the existing (public) nixl-wheel-builder image, whose
# mooncake-builder stage already built the Mooncake Store SDK to /opt/mooncake
# (libmooncake_store.so) -- so only the store *headers* are cloned fresh here.
# Builds on the self-hosted GB10 runner (CUDA toolchain + a live GPU).
#
# Published tag (GHCR):
#   lmcache-mooncake-wheel-builder:24.04-cu13.3-sm121

on:
  push:
    branches: [main]
    paths:
      - "docker/lmcache-mooncake/**"
      - "scripts/build/lmcache-mooncake.sh"
  workflow_dispatch: {}
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: 24.04-cu13.3-sm121

jobs:
  build-and-push:
    runs-on: [self-hosted, gb10]
    timeout-minutes: 720
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v ${{ github.workspace }}:/work alpine chown -R 1000:1000 /work

      - name: Checkout dgx-spark-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase repo name for GHCR
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push lmcache-mooncake-wheel-builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/lmcache-mooncake
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/lmcache-mooncake-wheel-builder:${{ env.IMAGE_TAG }}
          provenance: false
