name: Build build-env image

# Builds and publishes the build-env container image to GHCR. The CUDA-devel
# base is multi-GB and blows the free arm runner's 14 GB disk, so this runs on
# the self-hosted GB10 runner (no GPU needed for the image build itself, just
# disk). Wheel-build jobs then `container:` this image.

on:
  push:
    branches: [main]
    paths:
      - "docker/build-env/Dockerfile"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, gb10]
    steps:
      - name: Fix workspace permissions
        # Container build jobs run as root and leave root-owned files in the
        # shared workspace; this chowns them back to the runner user so checkout
        # can clean/reset the workspace.
        run: docker run --rm -v ${{ github.workspace }}:/work alpine chown -R 1000:1000 /work

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase repo name for GHCR
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push build-env:24.04
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/build-env
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/build-env:24.04
          provenance: false
