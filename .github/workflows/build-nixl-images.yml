name: Build nixl images
#
# Builds and publishes the GB10-specific nixl runtime and wheel-builder images
# to GHCR under the dgx-spark-wheels namespace. Runs on the self-hosted GB10
# runner because the build compiles CUDA code and the runtime smoke test loads
# the plugin stack (UCX/Mooncake/libfabric).
#
# The Dockerfile is self-contained: it clones nixl, UCX, and Mooncake source
# directly via git at pinned refs. The build context is docker/nixl/ (the
# Dockerfile + smoke-test.py), so only a single checkout of this repo is needed.
#
# Published tags (GHCR):
#   nixl-runtime:24.04-cu13.3-sm121
#   nixl-wheel-builder:24.04-cu13.3-sm121

on:
  push:
    branches: [main]
    paths:
      - "docker/nixl/**"
  workflow_dispatch: {}
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: 24.04-cu13.3-sm121

jobs:
  build-and-push:
    runs-on: [self-hosted, gb10]
    timeout-minutes: 720
    steps:
      - name: Fix workspace permissions
        run: docker run --rm -v ${{ github.workspace }}:/work alpine chown -R 1000:1000 /work

      - name: Checkout dgx-spark-wheels
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase repo name for GHCR
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push nixl-runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/nixl
          target: runtime
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/nixl-runtime:${{ env.IMAGE_TAG }}
          provenance: false

      - name: Run smoke test in runtime image
        run: |
          set -euo pipefail
          docker run --rm --gpus all \
            ghcr.io/${{ steps.repo.outputs.name }}/nixl-runtime:${{ env.IMAGE_TAG }} \
            python3 /opt/nixl/smoke-test.py

      - name: Build and push nixl-wheel-builder
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/nixl
          target: wheel-builder
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/nixl-wheel-builder:${{ env.IMAGE_TAG }}
          provenance: false