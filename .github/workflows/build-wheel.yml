name: Build wheel (self-hosted GB10 runner)
#
# Free GitHub-hosted arm64 runners (ubuntu-24.04-arm) are 4 vCPU / 16 GB RAM /
# 14 GB disk -- enough for the index generator (publish-index.yml) but NOT for
# any wheel build here: sageattn3/nunchaku probe the live GPU at build time,
# flash-attn caps MAX_JOBS at 4 (hdim256 backward kernels OOM above ~8), and
# onnxruntime-gpu is ~90 min on 20 cores with a large build tree. So every
# wheel builds on the self-hosted GB10 runner inside the build-env:24.04-cu<variant>
# container (variant from the `cuda` input, e.g. 13.3 -> cu13.3). See docs/ci.md
# for runner setup.
#
# Two jobs: "build" runs inside the container (CUDA toolchain + GPU); "release"
# runs on the bare runner host (no container) so the gh CLI is available for
# release upload. The wheel passes between them via actions/upload-artifact.
#
# Reusable (workflow_call): build-all.yml calls this workflow once per package,
# passing torch_wheel / triton_wheel artifact names produced earlier in the
# same run, so torch-linked wheels compile against the from-source torch
# instead of PyPI. Manual (workflow_dispatch) builds omit those inputs and
# fall back to PyPI torch (see scripts/build/common.sh).

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (must match a name in packages.json)"
        required: true
        type: choice
        options:
          - causal-conv1d
          - flash-attn
          - flashinfer-python
          - lmcache
          - mamba-ssm
          - nixl
          - uccl
          - deep-ep
          - flextensor
          - nunchaku
          - onnxruntime-gpu
          - sageattention
          - sageattn3
          - torch
          - torchaudio
          - torchvision
          - triton
      cuda:
        description: "CUDA variant (maps to build-env:24.04-cu<value>)"
        required: false
        type: string
        default: "13.3"
      torch_wheel:
        description: "Artifact name of a torch wheel built earlier in this run (optional)"
        required: false
        type: string
        default: ""
      triton_wheel:
        description: "Artifact name of a triton wheel built earlier in this run (optional)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      cuda:
        required: false
        type: string
        default: "13.3"
      torch_wheel:
        required: false
        type: string
        default: ""
      triton_wheel:
        required: false
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    if: inputs.package != 'nixl'
    runs-on: [self-hosted, gb10]
    timeout-minutes: 720
    container:
      # GHCR requires lowercase; the org name has uppercase letters.
      # Per-variant image tag: build-env:24.04-cu13.3 or build-env:24.04-cu13.0.
      image: ghcr.io/fulton-engineering-services/dgx-spark-wheels/build-env:24.04-cu${{ inputs.cuda }}
      options: --gpus all --ulimit memlock=-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download torch wheel artifact
        if: inputs.torch_wheel != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.torch_wheel }}
          path: wheels/torch

      - name: Download triton wheel artifact
        if: inputs.triton_wheel != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.triton_wheel }}
          path: wheels/triton

      - name: Build ${{ inputs.package }}
        env:
          CUDA_VARIANT: cu${{ inputs.cuda }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.torch_wheel }}" ]; then
            export TORCH_WHEEL="$(ls wheels/torch/*.whl | head -1)"
          fi
          if [ -n "${{ inputs.triton_wheel }}" ]; then
            export TRITON_WHEEL="$(ls wheels/triton/*.whl | head -1)"
          fi
          scripts/build/${{ inputs.package }}.sh

      - name: Smoke-test with a real kernel launch
        env:
          CUDA_VARIANT: cu${{ inputs.cuda }}
        run: scripts/build/verify-${{ inputs.package }}.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ inputs.package }}-cu${{ inputs.cuda }}
          path: dist/*.whl
          retention-days: 1

  # nixl is special: it doesn't build inside the build-env container. Instead
  # it extracts a pre-built wheel from the nixl-wheel-builder image (built by
  # build-nixl-images.yml) and verifies it inside the nixl-runtime image. Both
  # require docker CLI on the bare runner, so this job has no container:.
  build-nixl:
    if: inputs.package == 'nixl'
    runs-on: [self-hosted, gb10]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract and stamp nixl wheel
        env:
          CUDA_VARIANT: cu${{ inputs.cuda }}
        run: scripts/build/nixl.sh

      - name: Verify nixl in runtime image
        env:
          CUDA_VARIANT: cu${{ inputs.cuda }}
        run: scripts/build/verify-nixl.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ inputs.package }}-cu${{ inputs.cuda }}
          path: dist/*.whl
          retention-days: 1

  release:
    needs: [build, build-nixl]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build-nixl.result == 'success') }}
    # Runs on the free arm runner (not the self-hosted GB10 box) because: (1)
    # gh CLI is pre-installed, (2) clean workspace avoids root-owned file
    # conflicts from the container build job, (3) no GPU needed for a release
    # upload. The wheel is small (artifact transfer is fast).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ inputs.package }}-cu${{ inputs.cuda }}
          path: dist

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release tag uses the PUBLIC version segment only (no "+local"),
          # so "+" never lands in a git tag or download URL — and always
          # carries the -cu<variant> suffix so the two trains never collide.
          # The local-version segment lives in the wheel filename/metadata.
          version=$(python3 -c "import json; p=next(p for p in json.load(open('packages.json'))['packages'] if p['name']=='${{ inputs.package }}'); print(p.get('public_version') or p['version'].split('+')[0])")
          tag="${{ inputs.package }}-v${version}-cu${{ inputs.cuda }}"
          sha="${{ github.sha }}"
          gh release create "$tag" dist/*.whl --title "$tag" --notes "Built from packages.json at ${sha:0:7}" || \
          gh release upload "$tag" dist/*.whl --clobber
