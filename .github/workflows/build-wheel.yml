name: Build wheel (self-hosted GB10 runner)
#
# Free GitHub-hosted arm64 runners (ubuntu-24.04-arm) are 4 vCPU / 16 GB RAM /
# 14 GB disk -- enough for the index generator (publish-index.yml) but NOT for
# any wheel build here: sageattn3/nunchaku probe the live GPU at build time,
# flash-attn caps MAX_JOBS at 4 (hdim256 backward kernels OOM above ~8), and
# onnxruntime-gpu is ~90 min on 20 cores with a large build tree. So every
# wheel builds on the self-hosted GB10 runner inside the build-env:22.04
# container. See docs/ci.md for runner setup.
#
# Two jobs: "build" runs inside the container (CUDA toolchain + GPU); "release"
# runs on the bare runner host (no container) so the gh CLI is available for
# release upload. The wheel passes between them via actions/upload-artifact.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (must match a name in packages.json)"
        required: true
        type: choice
        options:
          - flash-attn
          - sageattention
          - sageattn3
          - nunchaku
          - onnxruntime-gpu

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: [self-hosted, gb10]
    container:
      # GHCR requires lowercase; the org name has uppercase letters.
      image: ghcr.io/fulton-engineering-services/dgx-spark-wheels/build-env:22.04
      options: --gpus all --ulimit memlock=-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ inputs.package }}
        run: scripts/build/${{ inputs.package }}.sh

      - name: Smoke-test with a real kernel launch
        run: scripts/build/verify-${{ inputs.package }}.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ inputs.package }}
          path: dist/*.whl
          retention-days: 1

  release:
    needs: build
    runs-on: [self-hosted, gb10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ inputs.package }}
          path: dist

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release tag uses the PUBLIC version segment only (no "+local"),
          # so "+" never lands in a git tag or download URL. The local-version
          # segment lives in the wheel filename/metadata.
          version=$(python3 -c "import json; p=next(p for p in json.load(open('packages.json'))['packages'] if p['name']=='${{ inputs.package }}'); print(p.get('public_version') or p['version'].split('+')[0])")
          tag="${{ inputs.package }}-v${version}"
          sha=$(git rev-parse --short HEAD)
          gh release create "$tag" dist/*.whl --title "$tag" --notes "Built from packages.json at ${sha}" || \
          gh release upload "$tag" dist/*.whl --clobber
