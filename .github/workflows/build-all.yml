name: Build all wheels (ordered, from-source toolchain)

on:
  workflow_dispatch:
    inputs:
      cuda_train:
        description: "CUDA train(s) to build: all, 13.3, or 13.0"
        required: true
        type: choice
        default: all
        options:
          - all
          - "13.3"
          - "13.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # --- Phase 0: nixl images (needs nothing, independent of torch/triton) ---
  # Builds the nixl-runtime and nixl-wheel-builder Docker images and pushes
  # them to GHCR. The nixl wheel extraction (Phase 5) depends on this.
  nixl-images:
    uses: ./.github/workflows/build-nixl-images.yml
    permissions:
      contents: read
      packages: write

  # --- Phase 1: Triton (needs nothing) ---
  triton:
    strategy:
      max-parallel: 2
      matrix:
        cuda: ${{ fromJSON(inputs.cuda_train == 'all' && '["13.3", "13.0"]' || format('["{0}"]', inputs.cuda_train)) }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      package: triton
      cuda: ${{ matrix.cuda }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  # --- Phase 2: PyTorch (needs Triton) ---
  torch:
    needs: triton
    strategy:
      max-parallel: 2
      matrix:
        cuda: ${{ fromJSON(inputs.cuda_train == 'all' && '["13.3", "13.0"]' || format('["{0}"]', inputs.cuda_train)) }}
    uses: ./.github/workflows/build-wheel.yml
    with:
      package: torch
      cuda: ${{ matrix.cuda }}
      triton_wheel: wheel-triton-cu${{ matrix.cuda }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  # --- Phase 3: torchaudio + torchvision, per CUDA train (2 or 4 legs) ---
  audio-video:
    needs: torch
    strategy:
      max-parallel: 2
      matrix:
        cuda: ${{ fromJSON(inputs.cuda_train == 'all' && '["13.3", "13.0"]' || format('["{0}"]', inputs.cuda_train)) }}
        package: [torchaudio, torchvision]
    uses: ./.github/workflows/build-wheel.yml
    with:
      package: ${{ matrix.package }}
      cuda: ${{ matrix.cuda }}
      torch_wheel: wheel-torch-cu${{ matrix.cuda }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  # --- Phase 4: Existing wheels rebuilt against from-source torch + triton,
  # per CUDA train (6 or 12 legs) ---
  existing:
    needs: [torch, triton]
    strategy:
      max-parallel: 2
      matrix:
        cuda: ${{ fromJSON(inputs.cuda_train == 'all' && '["13.3", "13.0"]' || format('["{0}"]', inputs.cuda_train)) }}
        package:
          - flash-attn
          - sageattention
          - sageattn3
          - nunchaku
          - onnxruntime-gpu
          - flashinfer-python
          - mamba-ssm
          - causal-conv1d
          - uccl
          - deep-ep
          - flextensor
    uses: ./.github/workflows/build-wheel.yml
    with:
      package: ${{ matrix.package }}
      cuda: ${{ matrix.cuda }}
      torch_wheel: wheel-torch-cu${{ matrix.cuda }}
      triton_wheel: wheel-triton-cu${{ matrix.cuda }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  # --- Phase 5: nixl wheel (needs nixl images only, parallel with torch stack) ---
  # nixl does not depend on torch or triton (it links CUDA but not the torch
  # C++ API), so it runs in parallel with the torch-linked phases. Only the
  # cu13.3 variant exists (sm_121-specific build). The nixl-images job must
  # complete first so the wheel-builder image is available for extraction.
  nixl:
    needs: nixl-images
    uses: ./.github/workflows/build-wheel.yml
    with:
      package: nixl
      cuda: "13.3"
    permissions:
      contents: write
      id-token: write
      attestations: write